name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 🐳 Setup Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🏗️ Build & Push Image
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/insurflow-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/insurflow-backend:latest

      # 🚀 Deploy to EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🧹 Cleaning Docker to free space..."
            docker system prune -a -f || true

            echo "📦 Pulling latest image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/insurflow-backend:latest

            echo "🛑 Stopping old container..."
            docker stop fastapi-app || true
            docker rm fastapi-app || true

            echo "🚀 Starting new container (AUTO-START ENABLED)..."
            docker run -d \
              --name fastapi-app \
              -p 8001:8001 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/insurflow-backend:latest

            echo "✅ Running containers:"
            docker ps

            echo "📜 Logs:"
            docker logs fastapi-app --tail 50
